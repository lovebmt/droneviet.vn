  </g>
  <text x="425" y="88" font-size="22" font-weight="700" fill="#08857a">Lực nâng</text><text x="425" y="112" font-size="16" fill="#4A6078">cánh quạt đẩy không khí xuống</text>
  <text x="425" y="365" font-size="22" font-weight="700" fill="#B42318">Trọng lực</text><text x="425" y="389" font-size="16" fill="#4A6078">khối lượng drone và pin</text>
  <text x="620" y="190" font-size="22" font-weight="700" fill="#0B6FE0">Lực đẩy</text><text x="600" y="270" font-size="16" fill="#4A6078">nghiêng drone để có</text><text x="600" y="290" font-size="16" fill="#4A6078">thành phần nằm ngang</text>
  <text x="80" y="190" font-size="22" font-weight="700" fill="#B54708">Lực cản</text><text x="40" y="270" font-size="16" fill="#4A6078">không khí cản lại</text><text x="40" y="290" font-size="16" fill="#4A6078">khi drone chuyển động</text>
  <text x="400" y="36" text-anchor="middle" font-size="18" font-weight="700" fill="#0F2742">Bốn lực tác dụng lên drone</text>
</svg>
