<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" font-family="Be Vietnam Pro, Arial, sans-serif">
  <rect width="800" height="450" fill="#F5F9FF"/>
  <text x="400" y="36" text-anchor="middle" font-size="18" font-weight="700" fill="#0F2742">Mỗi cảm biến trả lời một câu hỏi</text>
  <g transform="translate(400 240)"><g stroke="#4A6078" stroke-width="10" stroke-linecap="round"><line x1="-90" y1="-60" x2="90" y2="60"/><line x1="90" y1="-60" x2="-90" y2="60"/></g><rect x="-40" y="-30" width="80" height="60" rx="12" fill="#0F2742"/><g fill="#0B6FE0" fill-opacity=".3" stroke="#0B6FE0"><ellipse cx="-90" cy="-60" rx="44" ry="12"/><ellipse cx="90" cy="-60" rx="44" ry="12"/><ellipse cx="-90" cy="60" rx="44" ry="12"/><ellipse cx="90" cy="60" rx="44" ry="12"/></g></g>
  <g font-size="15">
    <rect x="30" y="70" width="230" height="78" rx="12" fill="#fff" stroke="#0B6FE0" stroke-width="2"/><text x="45" y="98" font-weight="700" fill="#0B6FE0">Con quay + gia tốc kế (IMU)</text><text x="45" y="122" fill="#0F2742">Mình đang nghiêng bao nhiêu,</text><text x="45" y="140" fill="#0F2742">quay nhanh thế nào?</text>
    <rect x="540" y="70" width="230" height="78" rx="12" fill="#fff" stroke="#13B8A6" stroke-width="2"/><text x="555" y="98" font-weight="700" fill="#08857a">Áp kế (barometer)</text><text x="555" y="122" fill="#0F2742">Mình đang ở độ cao nào</text><text x="555" y="140" fill="#0F2742">so với lúc cất cánh?</text>
    <rect x="30" y="330" width="230" height="78" rx="12" fill="#fff" stroke="#B54708" stroke-width="2"/><text x="45" y="358" font-weight="700" fill="#B54708">GPS + la bàn</text><text x="45" y="382" fill="#0F2742">Mình đang ở đâu ngoài trời,</text><text x="45" y="400" fill="#0F2742">mũi đang hướng về đâu?</text>
    <rect x="540" y="330" width="230" height="78" rx="12" fill="#fff" stroke="#4A6078" stroke-width="2"/><text x="555" y="358" font-weight="700" fill="#4A6078">Optical flow + đo xa</text><text x="555" y="382" fill="#0F2742">Mình có đang trôi không?</text><text x="555" y="400" fill="#0F2742">Cách mặt đất bao xa?</text>
  </g>
  <g stroke="#0F2742" stroke-width="1.5" stroke-dasharray="4 4"><path d="M260 120L360 220"/><path d="M540 120L440 220"/><path d="M260 360L360 260"/><path d="M540 360L440 260"/></g>
</svg>
