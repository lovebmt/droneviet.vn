<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 460" font-family="Be Vietnam Pro, Arial, sans-serif">
  <rect width="800" height="460" fill="#F5F9FF"/>
  <text x="400" y="36" text-anchor="middle" font-size="18" font-weight="700" fill="#0F2742">Khoanh vùng một buổi bay trong sân trường</text>
  <rect x="60" y="70" width="680" height="340" rx="16" fill="#FDB022" fill-opacity=".18" stroke="#B54708" stroke-width="3" stroke-dasharray="10 8"/>
  <rect x="160" y="110" width="480" height="200" rx="12" fill="#13B8A6" fill-opacity=".18" stroke="#08857a" stroke-width="3"/>
  <g font-size="16" text-anchor="middle">
    <text x="400" y="145" font-weight="700" fill="#08857a">Vùng bay</text><text x="400" y="167" fill="#0F2742" font-size="14">chỉ drone và nhiệm vụ, không có người</text>
    <g transform="translate(400 230)"><circle r="34" fill="#0B6FE0" fill-opacity=".25" stroke="#0B6FE0" stroke-width="2"/><text y="5" font-size="13" fill="#0F2742">ô cất cánh</text></g>
    <text x="400" y="100" font-weight="700" fill="#B54708" font-size="15">Vùng đệm: dây hoặc cọc, không ai đi qua khi đang bay</text>
    <rect x="250" y="340" width="300" height="56" rx="12" fill="#0F2742"/><text x="400" y="365" font-weight="700" fill="#fff">Khu người điều khiển</text><text x="400" y="385" fill="#fff" font-size="13">đứng sau vạch, nhìn thấy drone</text>
  </g>
  <text x="400" y="438" text-anchor="middle" font-size="14" fill="#4A6078">Học sinh xem ở ngoài vùng đệm.</text>
</svg>
