  <defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="14" orient="auto"><path d="M0 0L10 5L0 10z" fill="#E0A800"/></marker></defs><g fill="none" stroke="#FFC531" stroke-width="5" stroke-linecap="round" marker-end="url(#a)"><path d="M118 298 V273 H210"/><path d="M303 223 V198 H395"/><path d="M488 148 V123 H580"/></g>
