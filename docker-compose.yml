name: droneviet-commerce

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: droneviet
      POSTGRES_USER: droneviet
      POSTGRES_PASSWORD: droneviet
    ports:
      - "5433:5432"
    volumes:
      - droneviet_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U droneviet -d droneviet"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  droneviet_pg_data:
